<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World map – satellite</title>
<style>
  @font-face {
    font-family: 'TWK Ghost';
    src: url('source/TWKGhost-Regular.woff2') format('woff2');
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1d33; }
  canvas { display: block; }
  #map-sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: clamp(220px, 28vw, 320px);
    z-index: 2;
    box-sizing: border-box;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    color: #fff;
    background: rgb(0 0 0 / 90%);
    pointer-events: none;
  }
  #map-title {
    flex: 0 0 66.666%;
    min-height: 0;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    color: #fff;
    font: 400 clamp(1.05rem, 3.6vw, 3rem)/1.1 'TWK Ghost', sans-serif;
    pointer-events: none;
    text-shadow: 0 2px 12px rgb(0 0 0 / 75%);
    text-align: left;
    -webkit-text-stroke: 0.75px #000;
  }
  #map-title button {
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
    color: inherit;
    background: transparent;
    font: inherit;
    text-align: left;
    white-space: nowrap;
    text-shadow: inherit;
    -webkit-text-stroke: inherit;
    pointer-events: auto;
    cursor: pointer;
    transition: color 180ms ease, transform 180ms ease;
  }
  #map-title button[data-category="work"] { --category-hover: #d60036; }
  #map-title button[data-category="projects"] { --category-hover: #b319ab; }
  #map-title button[data-category="slice-of-life"] { --category-hover: #0057ba; }
  #map-title button[data-category="archive"] { --category-hover: #1b8e13; }
  #map-title button:hover,
  #map-title button:focus-visible,
  #map-title button[aria-pressed="true"] {
    color: var(--category-hover);
    transform: translateX(6px);
  }
  #map-title button:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 4px;
  }
  #map-credit {
    display: block;
    flex: 0 0 auto;
    margin-top: auto;
    min-width: 0;
    font: 10px/1.2 sans-serif;
    text-align: left;
    text-shadow: 0 1px 2px rgb(0 0 0 / 75%);
    overflow-wrap: anywhere;
  }
  #map-title span { display: block; white-space: nowrap; }
  @media (max-width: 450px) {
    #map-sidebar { width: min(220px, 70vw); padding: 16px; }
    #map-title { font-size: clamp(0.7rem, 4.5vw, 1.05rem); }
    #map-credit { font-size: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #map-title button { transition: none; }
  }
  #window-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
    pointer-events: none;
  }
  .desktop-window {
    position: absolute;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    width: 80vw;
    height: 80vh;
    min-width: min(280px, calc(100vw - 16px));
    min-height: min(180px, calc(100vh - 16px));
    max-width: calc(100vw - 16px);
    max-height: calc(100vh - 16px);
    border: 1px solid var(--window-accent, #738092);
    border-radius: 8px;
    color: #fff;
    background: #000;
    box-shadow: 0 12px 40px rgb(0 0 0 / 40%);
    pointer-events: auto;
    overflow: hidden;
  }
  .window-resize-handle {
    position: absolute;
    z-index: 3;
    touch-action: none;
  }
  .window-resize-handle:hover { background: rgb(115 128 146 / 20%); }
  .window-resize-n, .window-resize-s {
    right: 8px;
    left: 8px;
    height: 8px;
    cursor: ns-resize;
  }
  .window-resize-n { top: 0; }
  .window-resize-s { bottom: 0; }
  .window-resize-e, .window-resize-w {
    top: 8px;
    bottom: 8px;
    width: 8px;
    cursor: ew-resize;
  }
  .window-resize-e { right: 0; }
  .window-resize-w { left: 0; }
  .window-resize-nw, .window-resize-ne, .window-resize-sw, .window-resize-se {
    width: 12px;
    height: 12px;
  }
  .window-resize-nw, .window-resize-se { cursor: nwse-resize; }
  .window-resize-ne, .window-resize-sw { cursor: nesw-resize; }
  .window-resize-nw { top: 0; left: 0; }
  .window-resize-ne { top: 0; right: 0; }
  .window-resize-sw { bottom: 0; left: 0; }
  .window-resize-se { right: 0; bottom: 0; }
  .window-titlebar {
    display: flex;
    flex: 0 0 42px;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0 0.75rem 0 1rem;
    border-bottom: 1px solid var(--window-accent, #c5ccd5);
    background: color-mix(in srgb, var(--window-accent, #e4e9ef) 22%, white);
    color: #17212b;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .window-titlebar:active { cursor: grabbing; }
  .window-title {
    overflow: hidden;
    font: 600 0.95rem system-ui, sans-serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .window-close {
    border: 0;
    background: transparent;
    color: #17212b;
    font: 1.5rem/1 system-ui, sans-serif;
    cursor: pointer;
  }
  .window-close:hover { color: var(--window-accent, #17212b); }
  .window-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 1.5rem;
    background: #000;
    color: #fff;
  }
  .window-content-embed {
    position: relative;
    overflow: hidden;
    padding: 0;
  }
  .window-loading {
    position: absolute;
    z-index: 1;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 0.75rem;
    background: #000;
    color: #fff;
    font: 0.9rem/1.4 system-ui, sans-serif;
  }
  .window-loading-spinner {
    width: 2rem;
    height: 2rem;
    border: 3px solid rgb(255 255 255 / 30%);
    border-top-color: #fff;
    border-radius: 50%;
    animation: window-loading-spin 0.8s linear infinite;
  }
  @keyframes window-loading-spin {
    to { transform: rotate(360deg); }
  }
  .window-content-embed iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .window-loading-spinner { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="map-sidebar" aria-label="Map navigation and source information">
  <h1 id="map-title" aria-label="Filter map pins by category">
    <button type="button" class="map-filter" data-category="work" data-color="#d60036" aria-pressed="false">Work</button>
    <button type="button" class="map-filter" data-category="projects" data-color="#b319ab" aria-pressed="false">Projects</button>
    <button type="button" class="map-filter" data-category="slice-of-life" data-color="#0057ba" aria-pressed="false">Slice of Life</button>
    <button type="button" class="map-filter" data-category="archive" data-color="#1b8e13" aria-pressed="false">Archive</button>
  </h1>
  <small id="map-credit" aria-label="Map imagery attribution"></small>
</aside>
<div id="window-layer" aria-live="polite"></div>
<script src="script.js?v=project1-content-update"></script>
</body>
</html>
